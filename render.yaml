services:
  - type: web
    name: denz-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 denz:app
    healthCheckPath: /api/health
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: START_OLLAMA_WARMUP
        value: "false"
      - key: LOAD_DOTENV_OVERRIDE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
